<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="720" viewBox="0 0 1080 720" role="img" aria-hidden="true">
  <defs>
    <linearGradient id="b" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0e0c12"/>
      <stop offset="0.55" stop-color="#05060a"/>
      <stop offset="1" stop-color="#010102"/>
    </linearGradient>
    <radialGradient id="g" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ff9a3d" stop-opacity="0.55"/>
      <stop offset="0.55" stop-color="#ff9a3d" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#ff9a3d" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="s" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="v" cx="0.5" cy="0.45" r="0.75">
      <stop offset="0.4" stop-color="#000000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.55"/>
    </radialGradient>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="45"/>
    </filter>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" seed="5" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
  </defs>
  <rect width="1080" height="720" fill="url(#b)"/>
  <ellipse cx="518" cy="302" rx="342" ry="342" fill="url(#g)" filter="url(#blur)"/>
  <g filter="url(#blur)">
    <circle cx="270" cy="238" r="30" fill="#ffcc66" opacity="0.17"/>
    <circle cx="313" cy="569" r="48" fill="#ff7043" opacity="0.12"/>
    <circle cx="842" cy="317" r="56" fill="#ff9a3d" opacity="0.12"/>
    <circle cx="594" cy="511" r="22" fill="#ffcc66" opacity="0.12"/>
    <circle cx="637" cy="396" r="39" fill="#ff7043" opacity="0.27"/>
    <circle cx="389" cy="144" r="48" fill="#ff9a3d" opacity="0.27"/>
    <ellipse cx="324" cy="475" rx="115" ry="63" fill="url(#s)"/>
  </g>
  
  <rect width="1080" height="720" fill="url(#v)"/>
  <rect width="1080" height="720" filter="url(#grain)" opacity="0.07" style="mix-blend-mode:overlay"/>
</svg>
