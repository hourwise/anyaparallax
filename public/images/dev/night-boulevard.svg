<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="720" viewBox="0 0 1080 720" role="img" aria-hidden="true">
  <defs>
    <linearGradient id="b" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0c1015"/>
      <stop offset="0.55" stop-color="#05060a"/>
      <stop offset="1" stop-color="#010102"/>
    </linearGradient>
    <radialGradient id="g" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ff5a3c" stop-opacity="0.55"/>
      <stop offset="0.55" stop-color="#ff5a3c" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#ff5a3c" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="s" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="v" cx="0.5" cy="0.45" r="0.75">
      <stop offset="0.4" stop-color="#000000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.55"/>
    </radialGradient>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="48"/>
    </filter>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" seed="0" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
  </defs>
  <rect width="1080" height="720" fill="url(#b)"/>
  <ellipse cx="605" cy="302" rx="342" ry="342" fill="url(#g)" filter="url(#blur)"/>
  <g filter="url(#blur)">
    <circle cx="464" cy="425" r="48" fill="#5fb0ff" opacity="0.27"/>
    <circle cx="508" cy="310" r="22" fill="#ffb347" opacity="0.22"/>
    <circle cx="259" cy="504" r="30" fill="#ff5a3c" opacity="0.22"/>
    <circle cx="788" cy="252" r="39" fill="#5fb0ff" opacity="0.22"/>
    <circle cx="832" cy="583" r="56" fill="#ffb347" opacity="0.17"/>
    <circle cx="583" cy="331" r="22" fill="#ff5a3c" opacity="0.17"/>
    <ellipse cx="324" cy="475" rx="115" ry="63" fill="url(#s)"/>
  </g>
  
  <rect width="1080" height="720" fill="url(#v)"/>
