<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350" role="img" aria-hidden="true">
  <defs>
    <linearGradient id="b" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#140a0c"/>
      <stop offset="0.55" stop-color="#05060a"/>
      <stop offset="1" stop-color="#010102"/>
    </linearGradient>
    <radialGradient id="g" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ff2d4a" stop-opacity="0.55"/>
      <stop offset="0.55" stop-color="#ff2d4a" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#ff2d4a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="s" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="v" cx="0.5" cy="0.45" r="0.75">
      <stop offset="0.4" stop-color="#000000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.55"/>
    </radialGradient>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="77"/>
    </filter>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" seed="2" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
  </defs>
  <rect width="1080" height="1350" fill="url(#b)"/>
  <ellipse cx="562" cy="567" rx="513" ry="513" fill="url(#g)" filter="url(#blur)"/>
  <g filter="url(#blur)">
    <circle cx="270" cy="1013" r="84" fill="#ff2d4a" opacity="0.17"/>
    <circle cx="799" cy="540" r="32" fill="#ff8a3d" opacity="0.17"/>
    <circle cx="551" cy="905" r="45" fill="#ff4d9d" opacity="0.17"/>
    <circle cx="594" cy="689" r="71" fill="#ff2d4a" opacity="0.12"/>
    <circle cx="346" cy="1053" r="84" fill="#ff8a3d" opacity="0.12"/>
    <circle cx="875" cy="581" r="32" fill="#ff4d9d" opacity="0.12"/>
    <ellipse cx="324" cy="891" rx="173" ry="95" fill="url(#s)"/>
  </g>
  
  <rect width="1080" height="1350" fill="url(#v)"/>
