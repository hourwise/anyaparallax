<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350" role="img" aria-hidden="true">
  <defs>
    <linearGradient id="b" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0a0d12"/>
      <stop offset="0.55" stop-color="#05060a"/>
      <stop offset="1" stop-color="#010102"/>
    </linearGradient>
    <radialGradient id="g" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#7fd0ff" stop-opacity="0.55"/>
      <stop offset="0.55" stop-color="#7fd0ff" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#7fd0ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="s" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="v" cx="0.5" cy="0.45" r="0.75">
      <stop offset="0.4" stop-color="#000000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.55"/>
    </radialGradient>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="91"/>
    </filter>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" seed="6" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
  </defs>
  <rect width="1080" height="1350" fill="url(#b)"/>
  <ellipse cx="562" cy="567" rx="513" ry="513" fill="url(#g)" filter="url(#blur)"/>
  <g filter="url(#blur)">
    <circle cx="367" cy="621" r="58" fill="#7fd0ff" opacity="0.22"/>
    <circle cx="410" cy="405" r="84" fill="#b9e2ff" opacity="0.17"/>
    <circle cx="940" cy="770" r="32" fill="#ffb347" opacity="0.17"/>
    <circle cx="691" cy="297" r="45" fill="#7fd0ff" opacity="0.17"/>
    <circle cx="734" cy="918" r="71" fill="#b9e2ff" opacity="0.12"/>
    <circle cx="486" cy="446" r="84" fill="#ffb347" opacity="0.12"/>
    <ellipse cx="324" cy="891" rx="173" ry="95" fill="url(#s)"/>
  </g>
  
  <rect width="1080" height="1350" fill="url(#v)"/>
